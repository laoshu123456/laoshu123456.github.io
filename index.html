<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>报表登录入口</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 50px; }
        .btn { display: inline-block; margin: 10px; padding: 15px 30px; background: #0078d4; color: white; text-decoration: none; border-radius: 5px; }
        .btn:hover { background: #005a9e; }
    </style>
</head>
<body>
    <h1>请选择要查看的报表</h1>
    <div id="reportLinks">
        <!-- 按钮将在登录后显示，或直接显示（如果用户已登录） -->
    </div>
    <p id="status"></p>

    <script>
        // ========== 配置参数 ==========
        var clientId = "c9f64b12-9048-426e-b09c-e2e1d2e89f0c";
        var tenantId = "29abf16e-95a2-4d13-8d51-6db1b775d45b";
        var publicAccount = "DETBA@esquel.com";

        // 三个报表的 URL（替换成你实际的地址）
        var reportUrls = {
            report1: "https://app.powerbi.com/groups/.../report1",
            report2: "https://app.powerbi.com/groups/.../report2",
            report3: "https://app.powerbi.com/groups/.../report3"
        };

        // 当前页面地址（Azure AD 中注册的 Redirect URI）
        var redirectUri = window.location.origin + window.location.pathname;  // 动态获取

        // 检查是否已登录（是否携带 id_token）
        var hash = window.location.hash;
        if (hash && hash.indexOf("id_token") !== -1) {
            // 登录成功，显示报表选择按钮
            document.getElementById("status").innerHTML = "✅ 登录成功！请选择报表：";
            showButtons();
        } else {
            // 未登录，自动跳转 Azure AD 登录
            document.getElementById("status").innerHTML = "正在跳转登录……";
            var authUrl = 
                "https://login.microsoftonline.com/" + tenantId + "/oauth2/v2.0/authorize" +
                "?client_id=" + encodeURIComponent(clientId) +
                "&response_type=id_token" +
                "&redirect_uri=" + encodeURIComponent(redirectUri) +
                "&scope=openid%20email%20profile" +
                "&prompt=login" +
                "&login_hint=" + encodeURIComponent(publicAccount) +
                "&nonce=" + Math.random().toString(36).substring(2, 10);
            window.location.href = authUrl;
        }

        // 显示三个报表按钮
        function showButtons() {
            var container = document.getElementById("reportLinks");
            var html = "";
            for (var key in reportUrls) {
                html += '<a href="' + reportUrls[key] + '" class="btn" target="_blank">📊 ' + key + '</a>';
            }
            container.innerHTML = html;
        }
    </script>
</body>
</html>
